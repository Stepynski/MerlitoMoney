<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  *{box-sizing:border-box}
  body{margin:0;background:#eef0f3;color:#1b1f26;font-family:Figtree,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
  a{color:#3b5bdb;text-decoration:none}
  a:hover{color:#2f49b0}
  input,select,button,textarea{font-family:inherit;font-size:inherit;color:inherit}
  select{appearance:none}
  button{-webkit-tap-highlight-color:transparent}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#d3d7de;border-radius:6px;border:3px solid #eef0f3}
  @keyframes kb-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes kb-in{from{opacity:0}to{opacity:1}}
  .mm-dash-hero{display:grid;grid-template-columns:1fr;gap:14px}
  .mm-dash-split{display:grid;grid-template-columns:1fr;gap:14px}
  @media (min-width:760px){
    .mm-dash-hero{grid-template-columns:2fr 1fr}
    .mm-dash-split{grid-template-columns:1fr 1fr}
  }
</style>
