services:
  db:
    image: mariadb:lts
    container_name: merlitomoney_db
    restart: unless-stopped
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - merlitomoney

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: merlitomoney_app
    restart: unless-stopped
    env_file: .env
    volumes:
      - upload_data:/var/www/html/storage/upload
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - merlitomoney

  cron:
    image: alpine
    container_name: merlitomoney_cron
    restart: unless-stopped
    env_file: .env
    command: ["sh", "-c", "apk add --no-cache tzdata curl && \
      echo \"0 3 * * * curl -fsS http://app:80/api/v1/cron/$$STATIC_CRON_TOKEN > /dev/null\" | crontab - && \
      crond -f -L /dev/stdout"]
    depends_on:
      - app
    networks:
      - merlitomoney

volumes:
  db_data:
  upload_data:

networks:
  merlitomoney:
    driver: bridge
